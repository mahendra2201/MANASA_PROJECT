# Server
server.port=${SERVER_PORT:3000}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediapulse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ab123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Initialization (auto-creates tables and loads data on first run)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# JWT
app.jwt.secret=${JWT_SECRET:mediapulse_super_secret_jwt_key_2025_extended_for_256bit_security}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.mediapulse=INFO
logging.level.org.springframework.security=WARN
